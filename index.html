<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="16-week SDE2 / Senior Java interview study guide: Java, concurrency, JVM, Spring Boot, databases, LLD, HLD. Progress saves in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238A2E52'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<title>SDE2 Java Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: study desk — a quiet left rail (nav + where-am-I), one reading column, week cards like a printed planner. */
:root{
  --ink:#1A1417; --paper:#FBF9FA; --surface:#FFFFFF; --surface-2:#F4EFF2;
  --border:#E7E0E4; --border-strong:#D3C7CD; --muted:#7A6E74;
  --accent:#8A2E52; --accent-soft:#F6E8EE; --accent-ink:#FFFFFF;
  --done:#2E7D5B; --done-soft:#E4F1EA; --due:#B4690E; --due-soft:#FBF0E1;
  --info:#3E5C8A; --info-soft:#E7EDF6; --warn:#C0392B;
  --code-bg:#F7F3F5;
  --shadow:0 1px 2px rgba(26,20,23,.05), 0 8px 24px -12px rgba(26,20,23,.18);
  --radius:10px;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --read-size:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#F2EDEF; --paper:#161114; --surface:#1F181C; --surface-2:#271E23;
    --border:#362C31; --border-strong:#4A3C43; --muted:#A2939A;
    --accent:#E8749C; --accent-soft:#3A2330; --accent-ink:#1A1417;
    --done:#5BC493; --done-soft:#1E3830; --due:#E0A44E; --due-soft:#3A2D1A;
    --info:#93B4E8; --info-soft:#1F2A3C; --warn:#EE8477;
    --code-bg:#1A1417;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#F2EDEF; --paper:#161114; --surface:#1F181C; --surface-2:#271E23;
  --border:#362C31; --border-strong:#4A3C43; --muted:#A2939A;
  --accent:#E8749C; --accent-soft:#3A2330; --accent-ink:#1A1417;
  --done:#5BC493; --done-soft:#1E3830; --due:#E0A44E; --due-soft:#3A2D1A;
  --info:#93B4E8; --info-soft:#1F2A3C; --warn:#EE8477;
  --code-bg:#1A1417;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.sn{font-family:var(--mono);font-size:.86em;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));
  border-right:1px solid var(--border);background:var(--paper);display:flex;flex-direction:column;gap:14px;padding:18px 14px;overflow-y:auto}
.brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.logo{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.1;margin:2px 0 0;text-decoration:none;display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:17px;height:17px;flex:none}
.searchbtn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:13.5px;text-align:left}
.searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:0 5px}
.railsec{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 10px -6px}
.toc{display:flex;flex-direction:column;gap:1px;margin:0;padding:0;list-style:none}
.toc a{display:grid;grid-template-columns:10px 34px minmax(0,1fr);gap:4px;align-items:baseline;text-decoration:none;font-size:12.5px;line-height:1.35;padding:4px 8px;border-radius:6px;color:var(--muted)}
.toc a:hover{background:var(--surface-2);color:var(--ink)}
.toc a.here{background:var(--surface-2);color:var(--ink);font-weight:500}
.toc .sn{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--border-strong);display:inline-block;transform:translateY(-1px)}
.dot.read{background:var(--done);border-color:var(--done)}
.dot.due{background:var(--due);border-color:var(--due)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:7px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.sync[data-s="cloud"] i{background:var(--done)}
.sync[data-s="saving"] i{background:var(--due)}
.railbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{color:var(--warn)}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:99px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}

.mobbar{display:none}
.tabbar{display:none}
main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:26px 90px}
.page{max-width:900px;margin:0 auto}
.page.reader{max-width:780px}

/* ---------- headers, meters, tiles ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1.h{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.4vw,34px);margin:4px 0 4px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:14.5px;max-width:62ch}
.meter{margin-top:14px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.pct{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.tile b{display:block;font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile b small{font-size:12px;color:var(--muted);font-weight:400}
.tile span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.phase{margin:30px 0 10px;display:flex;align-items:center;gap:10px}
.phase h2{font-family:var(--display);font-weight:600;font-size:14px;margin:0;letter-spacing:.02em;white-space:nowrap}
.phase .rule{flex:1;height:1px;background:var(--border)}
.phase .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.controls{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;align-items:center}
.spacer{flex:1 1 auto}

/* ---------- today ---------- */
.todayset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;min-width:0}
.tcard:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.tcard .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.tcard.new .k{color:var(--accent)} .tcard.rev .k{color:var(--due)} .tcard.none .k{color:var(--done)}
.tcard .t{font-weight:600;font-size:15px;line-height:1.3}
.tcard .m{font-size:12.5px;color:var(--muted)}
.tcard .go{margin-top:auto;font-size:12.5px;color:var(--accent);font-weight:500}
.continue{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;text-decoration:none}
.continue b{font-weight:600}
.continue span{color:var(--muted);font-size:13px}
.continue .go{margin-left:auto;color:var(--accent);font-size:13px;font-weight:500;white-space:nowrap}
.howto{margin-top:12px;font-size:13.5px;color:var(--muted);max-width:68ch}
.howto b{color:var(--ink)}

/* ---------- week cards (planner) ---------- */
.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px;overflow:hidden}
.day[open]{box-shadow:var(--shadow);border-color:var(--border-strong)}
.day summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 13px}
.day summary::-webkit-details-marker{display:none}
.day summary:hover{background:var(--surface-2)}
.dnum{flex:none;width:40px;height:34px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.day[data-done="1"] .dnum{background:var(--done);border-color:var(--done);color:#fff}
.day[data-now="1"]:not([data-done="1"]) .dnum{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dtop{flex:1;min-width:0}
.dtop .t{font-weight:500;font-size:14.5px;display:block;overflow-wrap:anywhere}
.day[data-done="1"] .dtop .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.dtop .m{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.pill.now{background:var(--accent-soft);color:var(--accent)}
.pill.gate{background:var(--info-soft);color:var(--info)}
.mini{flex:none;width:52px;height:4px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.mini>i{display:block;height:100%;width:0;background:var(--accent)}
.day[data-done="1"] .mini>i{background:var(--done)}
.caret{flex:none;color:var(--muted);font-size:11px;transition:transform .18s}
.day[open] .caret{transform:rotate(90deg)}
.wbody{padding:2px 13px 14px;border-top:1px dashed var(--border)}
.secttl{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:13px 0 6px;font-weight:600}
ul.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.check li{display:flex;align-items:flex-start;gap:9px;padding:4px 6px;border-radius:6px}
ul.check li:hover{background:var(--surface-2)}
ul.check input[type=checkbox]{flex:none;margin:3px 0 0;width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
ul.check .lab{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
ul.check a.lab{text-decoration:none}
ul.check a.lab:hover{text-decoration:underline;text-underline-offset:2px}
ul.check li.on .lab{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
ul.check .sn{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.tag{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.07em;padding:1px 5px;border-radius:4px;margin-top:3px;border:1px solid currentColor}
.tag.due{color:var(--due)}
.gatebox{margin-top:13px;padding:9px 11px;background:var(--info-soft);border-radius:7px}
.gatebox .secttl{color:var(--info);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px;border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface)}

/* ---------- chapters ---------- */
.chgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-decoration:none;display:flex;flex-direction:column;gap:8px;min-width:0}
.chcard:hover{border-color:var(--border-strong);box-shadow:var(--shadow)}
.chcard .top{display:flex;gap:10px;align-items:baseline}
.chcard .n{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
.chcard .t{font-weight:600;font-size:14.5px;line-height:1.3}
.chcard .row{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chcard .row .bar{height:5px}
.chcard.done .row .bar>i{background:var(--done)}

/* ---------- notes ---------- */
.nitem{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.nitem a{font-weight:600;text-decoration:none}
.nitem a:hover{text-decoration:underline}
.nitem .sn{font-family:var(--mono);font-size:12px;color:var(--accent);margin-right:6px}
.nitem p{margin:6px 0 0;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.nitem small{color:var(--muted);font-family:var(--mono);font-size:11px}

/* ---------- reader ---------- */
.rtools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--border);margin:-26px 0 18px;padding:10px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtools .where{font-size:13px;color:var(--muted);min-width:0;flex:1 1 200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtools .where b{color:var(--ink);font-weight:600}
.rtools .bar{max-width:120px;height:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chhead .chn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.prose{font-size:var(--read-size);line-height:1.68}
.prose h2{font-family:var(--display);font-weight:600;font-size:1.45em;line-height:1.2;letter-spacing:-.01em;margin:2.4em 0 .3em;text-wrap:balance;scroll-margin-top:70px}
.prose h3{font-family:var(--display);font-weight:600;font-size:1.12em;margin:1.6em 0 .3em}
.prose h4{font-family:var(--mono);font-size:.68em;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:1.8em 0 .5em;font-weight:600;display:flex;align-items:center;gap:8px}
.prose h4::after{content:"";flex:1;height:1px;background:var(--border)}
.prose p,.prose li{max-width:68ch}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin:.25em 0}
.prose code{overflow-wrap:anywhere;font-family:var(--mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.prose .hl{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;margin:1em 0;overflow-x:auto}
.prose .hl pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:12.6px;line-height:1.55}
.prose .hl code{background:none;border:0;padding:0;font-size:inherit}
.prose pre{overflow-x:auto}
.prose .tbl{overflow-x:auto;margin:1em 0;border:1px solid var(--border);border-radius:8px}
.prose table{border-collapse:collapse;width:100%;font-size:.86em}
.prose th,.prose td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.prose th{background:var(--surface-2);font-weight:600}
.prose tr:last-child td{border-bottom:0}
.prose p.simple{background:var(--done-soft);border-radius:8px;padding:10px 13px;max-width:none}
.prose p.simple strong:first-child{display:block;font-family:var(--mono);font-size:.66em;letter-spacing:.12em;text-transform:uppercase;color:var(--done)}
.prose blockquote{margin:1em 0;padding:9px 13px;border-radius:8px;background:var(--surface-2)}
.prose blockquote p{margin:.3em 0}
.prose blockquote.co.trap{background:var(--due-soft)}
.prose blockquote.co.tip,.prose blockquote.co.remember,.prose blockquote.co.rule{background:var(--accent-soft)}
.prose blockquote.co.interview,.prose blockquote.co.saythis{background:var(--info-soft)}
.prose p.qa{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 13px;max-width:none}
.prose p.qa>strong:first-child{display:block;margin-bottom:3px}
.quiz .prose p.qa .ans{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s}
.quiz .prose p.qa.shown .ans{filter:none;user-select:auto}
.quiz .prose p.qa .ans::before{content:""}
.stool{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px;font-size:12.5px}
.tbtn{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:99px;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--border-strong);color:var(--ink)}
.tbtn[aria-pressed="true"].read{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:500}
.tbtn[aria-pressed="true"].rev{background:var(--due-soft);border-color:var(--due);color:var(--due);font-weight:500}
.tbtn.note[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stool .due{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stool .due.now{color:var(--due);font-weight:600}
.notebox{margin:0 0 12px}
.notebox textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:14px;line-height:1.5;padding:9px 11px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink)}
.notebox small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:40px}
.pn a{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;text-decoration:none;font-weight:500;font-size:14px;min-width:0}
.pn a:hover{border-color:var(--border-strong)}
.pn a span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pn a.next{text-align:right;grid-column:2}
.loading{color:var(--muted);padding:40px 0}

/* ---------- search ---------- */
.sdlg{position:fixed;inset:0;z-index:50;background:rgba(26,20,23,.35);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 8vh) 16px 16px}
.sbox{width:min(640px,100%);background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.sbox input{border:0;border-bottom:1px solid var(--border);padding:14px 16px;font:inherit;font-size:16px;background:transparent;color:var(--ink);outline:none}
.sres{overflow-y:auto}
.sres a{display:block;padding:10px 16px;text-decoration:none;border-bottom:1px solid var(--border)}
.sres a[aria-selected="true"],.sres a:hover{background:var(--surface-2)}
.sres b{display:block;font-size:14px}
.sres small{display:block;color:var(--muted);font-size:12.5px;line-height:1.45}
.sres mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
.shint{padding:12px 16px;color:var(--muted);font-size:13px}

/* ---------- backup panel ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:30px;font-size:13px;color:var(--muted)}
.panel h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 4px;color:var(--ink)}
.panel p{margin:0 0 8px}
.io{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#code{font-family:var(--mono);font-size:11px;width:100%;margin-top:8px;padding:8px;border-radius:7px;border:1px solid var(--border);background:var(--paper);color:var(--ink);resize:vertical;min-height:58px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow)}

/* ---------- phone ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--border);padding:10px 16px}
  .mobbar .logo{font-size:17px}
  .mobbar .spacer{flex:1}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 8px;font-size:10.5px;text-decoration:none;color:var(--muted);border:0;background:none;cursor:pointer}
  .tabbar svg{width:20px;height:20px}
  .tabbar [aria-current="page"]{color:var(--accent);font-weight:600}
  main{padding-block:16px 96px}
  .rtools{top:calc(env(safe-area-inset-top,0px) + 53px);margin-top:-16px;flex-wrap:nowrap}
  .rtools .bar,.rtools .pct,.rtools .fs{display:none}
  .rtools .where{flex:1 1 auto}
  .prose h2{scroll-margin-top:118px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .todayset{grid-template-columns:minmax(0,1fr)}
  .chgrid{grid-template-columns:minmax(0,1fr)}
  .mini{display:none}
  .phase{flex-wrap:wrap;row-gap:2px}
  .phase h2{white-space:normal}
  .phase .rule{display:none}
  .phase .cnt{white-space:normal}
  .sheet{position:fixed;inset:auto 0 0 0;z-index:40;background:var(--surface);border-top:1px solid var(--border-strong);border-radius:14px 14px 0 0;max-height:70vh;overflow-y:auto;padding:14px 14px calc(70px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
}
@media (min-width:861px){ .sheet{display:none!important} .mobonly{display:none!important} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {
"use strict";
const KEY = "sde2guide.v1";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY = 864e5;
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dnum = s => Math.round(new Date(s+"T00:00:00").getTime()/DAY);
const fmt = s => new Date(s+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
const INTERVALS = [1, 3, 7, 14, 30, 60];

/* ---------------- state ---------------- */
let S = {read:{}, rev:{}, tasks:{}, notes:{}, last:null, prefs:{quiz:false, size:16, theme:null}, v:0, nv:0};
try { const raw = JSON.parse(localStorage.getItem(KEY) || "null"); if (raw && typeof raw === "object") S = Object.assign(S, raw); } catch(e) {}
S.prefs = Object.assign({quiz:false, size:16, theme:null}, S.prefs || {});
if (S.done && !Object.keys(S.read).length) delete S.done;
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function applyPrefs(){
  if (S.prefs.theme) document.documentElement.dataset.theme = S.prefs.theme; else delete document.documentElement.dataset.theme;
  document.documentElement.style.setProperty("--read-size", (S.prefs.size||16) + "px");
}
applyPrefs();

/* ---------------- cloud sync (your Claude account, private to you) ---------------- */
const cloud = {pref:null, nref:null, on:false};
function setSync(s){
  const txt = {local:"Saved in this browser", cloud:"Synced to your account", saving:"Saving…"}[s];
  for (const el of [$("#sync"), $("#sync2")]) { if (!el) continue; el.dataset.s = s; const sp = el.querySelector("span"); if (sp) sp.textContent = txt; el.title = txt; }
}
const writer = (getRef, payload) => {
  let busy = false, dirty = false, timer = null;
  async function flush(){
    const ref = getRef(); if (!ref || busy) return;
    busy = true; setSync("saving");
    while (dirty) {
      dirty = false;
      try { await ref.set(payload()); }
      catch (e) {
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 1200 + Math.random()*800)); try { await ref.set(payload()); } catch(_) { dirty = true; break; } }
        else { if (e && e.code === "quota_exceeded") toast("Cloud storage is full. Your progress is still saved in this browser."); else if (e && e.code === "invalid_argument") toast("That note is too large to sync. Shorten it a little."); break; }
      }
    }
    busy = false; setSync(cloud.on ? "cloud" : "local");
  }
  return { mark(delay = 700){ dirty = true; clearTimeout(timer); timer = setTimeout(flush, delay); } };
};
const pW = writer(() => cloud.pref, () => ({read:S.read, rev:S.rev, tasks:S.tasks, last:S.last, prefs:S.prefs, v:S.v}));
const nW = writer(() => cloud.nref, () => ({notes:S.notes, nv:S.nv}));
function changed(kind = "p", delay){
  if (kind === "n") S.nv = Date.now(); else S.v = Date.now();
  saveLocal();
  if (cloud.on) (kind === "n" ? nW : pW).mark(delay);
}
async function initCloud(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!user || !db) return;
    const uid = await user.id(); if (!uid) return;
    cloud.pref = db.doc("data/users/" + uid + "/progress");
    cloud.nref = db.doc("data/users/" + uid + "/notes");
    cloud.on = true; setSync("cloud");
    cloud.pref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists) { if (S.v) pW.mark(10); return; }
      const d = snap.data() || {};
      if ((d.v||0) > (S.v||0)) {
        S.read = Object.assign({}, d.read||{}); S.rev = JSON.parse(JSON.stringify(d.rev||{})); S.tasks = Object.assign({}, d.tasks||{});
        S.last = d.last || null; S.prefs = Object.assign(S.prefs, d.prefs||{}); S.v = d.v; saveLocal(); applyPrefs(); refresh();
      } else if ((d.v||0) < (S.v||0)) pW.mark(10);
    }, () => { cloud.on = false; setSync("local"); });
    cloud.nref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists) { if (S.nv) nW.mark(10); return; }
      const d = snap.data() || {};
      if ((d.nv||0) > (S.nv||0)) {
        S.notes = JSON.parse(JSON.stringify(d.notes||{})); S.nv = d.nv; saveLocal();
        if (!document.activeElement || document.activeElement.tagName !== "TEXTAREA") refresh();
      } else if ((d.nv||0) < (S.nv||0)) nW.mark(10);
    }, () => {});
  } catch(e) { cloud.on = false; setSync("local"); }
}

/* ---------------- data ---------------- */
let D = null, SEC = {}, ORDER = [], CH = {};
const content = new Map();
async function loadData(){
  const r = await fetch("data.json"); D = await r.json();
  for (const c of D.chapters) {
    CH[c.n] = c;
    for (const [num, id, title] of c.secs) if (num) { SEC[num] = {num, id, title, ch:c.n}; ORDER.push(num); }
  }
}
const isRead = n => !!S.read[n];
function dueInfo(n){
  if (!S.read[n]) return null;
  const r = S.rev[n] || {n:0, last:S.read[n]};
  const due = dnum(r.last) + INTERVALS[Math.min(r.n, INTERVALS.length-1)];
  return {due, overdue: dnum(today()) - due, count:r.n, last:r.last};
}
const isDue = n => { const d = dueInfo(n); return !!d && d.overdue >= 0; };
function weekItems(w){
  const items = [];
  for (const g of w.groups) { for (const n of g.secs) items.push({sec:n}); for (const t of g.tasks) items.push({task:t.k}); }
  for (const t of w.out) items.push({task:t.k});
  if (w.gate) for (const t of w.gate.items) items.push({task:t.k});
  return items;
}
const itemDone = it => it.sec ? isRead(it.sec) : !!S.tasks[it.task];
function weekStats(w){ const its = weekItems(w); const got = its.filter(itemDone).length; return {got, tot:its.length, done: its.length > 0 && got === its.length}; }
function weekDates(w){ const s = new Date(D.planStart+"T00:00:00").getTime() + (w.n-1)*7*DAY; return [s, s + 6*DAY]; }
function currentWeekNo(){
  const t = dnum(today()), s = dnum(D.planStart);
  if (t < s) return 0;
  return Math.min(16, Math.floor((t - s)/7) + 1);
}
function nextNew(){
  for (const w of D.weeks) for (const g of w.groups) for (const n of g.secs) if (!isRead(n)) return n;
  return ORDER.find(n => !isRead(n)) || null;
}
function dueList(){
  return ORDER.filter(n => S.read[n]).map(n => ({n, ...dueInfo(n)})).filter(x => x.overdue >= 0).sort((a,b) => b.overdue - a.overdue || a.count - b.count);
}

/* ---------------- views ---------------- */
const main = $("#main");
let view = "today", viewArg = null;

function stats(){
  const read = ORDER.filter(isRead).length;
  const revs = Object.values(S.rev).reduce((a,r) => a + (r.n||0), 0);
  const notes = Object.values(S.notes).filter(x => x && x.t && x.t.trim()).length;
  const weeks = D.weeks.filter(w => weekStats(w).done).length;
  return {read, revs, notes, weeks, pct: Math.round(read / ORDER.length * 100)};
}
function headerBlock(eyebrow, title, lede){
  const st = stats();
  return `<div class="eyebrow">${eyebrow}</div><h1 class="h">${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ""}
  <div class="meter"><div class="bar"><i style="width:${st.pct}%"></i></div><span class="pct">${st.pct}%</span></div>
  <div class="tiles">
    <div class="tile"><b>${st.weeks}<small>/16</small></b><span>Weeks done</span></div>
    <div class="tile"><b>${st.read}<small>/${ORDER.length}</small></b><span>Sections read</span></div>
    <div class="tile"><b>${st.revs}</b><span>Revisions</span></div>
    <div class="tile"><b>${st.notes}</b><span>Notes written</span></div>
  </div>`;
}
const secLink = n => "#s" + n.replace(".", "-");
const secLabel = n => `<span class="sn">${n}</span>${esc(SEC[n].title)}`;

function renderToday(){
  const cw = currentWeekNo();
  const w = D.weeks[Math.max(0, cw-1)];
  const [ws] = weekDates(D.weeks[0]);
  const startTxt = new Date(ws).toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
  const eyebrow = cw === 0 ? `Plan starts ${startTxt}` : `Week ${cw} of 16 · ${esc(w.dates)}`;
  const nn = nextNew(), dl = dueList();
  let cards = "";
  if (nn) { const s = SEC[nn]; cards += `<a class="tcard new" href="${secLink(nn)}"><span class="k">New · 1 section</span><span class="t">${secLabel(nn)}</span><span class="m">Chapter ${s.ch} · ${esc(CH[s.ch].title)}</span><span class="go">Start reading →</span></a>`; }
  else cards += `<div class="tcard none"><span class="k">New</span><span class="t">Every section is read.</span><span class="m">Spend the time on mocks and revision.</span></div>`;
  const rv = dl.slice(0, 2);
  rv.forEach(x => { cards += `<a class="tcard rev" href="${secLink(x.n)}"><span class="k">Revise · ${x.overdue > 0 ? x.overdue + " day" + (x.overdue>1?"s":"") + " overdue" : "due today"}</span><span class="t">${secLabel(x.n)}</span><span class="m">Revised ${x.count} time${x.count===1?"":"s"} · last ${fmt(x.last)}</span><span class="go">Revise now →</span></a>`; });
  for (let i = rv.length; i < 2; i++) cards += `<div class="tcard none"><span class="k">Revise</span><span class="t">${ORDER.some(isRead) ? "Nothing due yet." : "Nothing to revise yet."}</span><span class="m">${ORDER.some(isRead) ? "Sections come back here 1, 3, 7, 14 and 30 days after you read them." : "Read your first section; it comes back here tomorrow."}</span></div>`;
  let cont = "";
  if (S.last && SEC[S.last]) cont = `<a class="continue" href="${secLink(S.last)}"><span>Continue where you stopped</span><b>${secLabel(S.last)}</b><span class="go">Open →</span></a>`;
  const wk = cw ? D.weeks[cw-1] : D.weeks[0];
  main.innerHTML = `<div class="page">${headerBlock(eyebrow, "Today’s study set", "One new section and two revisions a day. Tick sections as you read them; everything else follows.")}
    <div class="phase"><h2>1 new + 2 revise</h2><div class="rule"></div><span class="cnt">${dl.length} due in total</span></div>
    <div class="todayset">${cards}</div>${cont}
    <div class="phase"><h2>${cw ? "This week" : "Week 1"}</h2><div class="rule"></div><span class="cnt"><a href="#plan">Open the plan →</a></span></div>
    ${weekCard(wk, true)}
    <p class="howto"><b>How a section works:</b> read it, then press <b>Mark as read</b>. When it shows up under Revise, open it, answer its interview questions aloud with Quiz mode on, and press <b>Revised</b>. Write anything you want to remember in <b>Notes</b>.</p>
    ${backupPanel()}</div>`;
  bindWeekCards(); bindBackup();
}

const PHASES = [["Java foundations", 1, 4], ["Concurrency, JVM, Spring core", 5, 8], ["Spring, databases, project", 9, 12], ["Interview mode", 13, 16]];
let planFilter = "all", hideDone = false;
function weekCard(w, open){
  const st = weekStats(w), cw = currentWeekNo(), pct = st.tot ? Math.round(st.got/st.tot*100) : 0;
  let body = "";
  for (const g of w.groups) {
    if (!g.secs.length && !g.tasks.length) continue;
    body += `<div class="secttl">${esc(g.label)}</div><ul class="check">`;
    for (const n of g.secs) {
      const on = isRead(n), du = isDue(n);
      body += `<li class="${on?"on":""}"><input type="checkbox" data-sec="${n}" ${on?"checked":""} aria-label="Mark ${n} as read"><a class="lab" href="${secLink(n)}">${secLabel(n)}</a>${du?'<span class="tag due">REVISE</span>':""}</li>`;
    }
    for (const t of g.tasks) {
      const on = !!S.tasks[t.k];
      const lab = t.ch != null && CH[t.ch] ? `<a class="lab" href="#c${t.ch}">${esc(t.t)}</a>` : `<span class="lab">${esc(t.t)}</span>`;
      body += `<li class="${on?"on":""}"><input type="checkbox" data-task="${t.k}" ${on?"checked":""} aria-label="Mark task done">${lab}</li>`;
    }
    body += `</ul>`;
  }
  if (w.out.length) {
    body += `<div class="secttl">End-of-week output</div><ul class="check">`;
    for (const t of w.out) { const on = !!S.tasks[t.k]; body += `<li class="${on?"on":""}"><input type="checkbox" data-task="${t.k}" ${on?"checked":""} aria-label="Mark output done"><span class="lab">${esc(t.t)}</span></li>`; }
    body += `</ul>`;
  }
  if (w.gate) {
    body += `<div class="gatebox"><div class="secttl">Gate ${w.gate.n} · pass before moving on</div><ul class="check">`;
    for (const t of w.gate.items) { const on = !!S.tasks[t.k]; body += `<li class="${on?"on":""}"><input type="checkbox" data-task="${t.k}" ${on?"checked":""} aria-label="Mark gate item passed"><span class="lab">${esc(t.t)}</span></li>`; }
    body += `</ul></div>`;
  }
  return `<details class="day" data-w="${w.n}" data-done="${st.done?1:0}" data-now="${w.n===cw?1:0}"${open?" open":""}>
    <summary><span class="dnum">W${String(w.n).padStart(2,"0")}</span>
    <span class="dtop"><span class="t">${esc(w.topic)}${w.n===cw?'<span class="pill now">This week</span>':""}${w.gate?`<span class="pill gate">Gate ${w.gate.n}</span>`:""}</span>
    <span class="m">${esc(w.dates)} · ${st.got}/${st.tot} done</span></span>
    <span class="mini"><i style="width:${pct}%"></i></span><span class="caret">&#9654;</span></summary>
    <div class="wbody">${body}</div></details>`;
}
function renderPlan(openWeek){
  const cw = currentWeekNo();
  let html = `<div class="page">${headerBlock("16 weeks · Oct 5 → Jan 24", "The plan", "Weekdays: one hour of Java, Spring or databases. Saturday: LLD. Sunday: HLD. Ticking a section here also marks it read in the chapter.")}
    <div class="controls">
      <button class="chip" data-f="all" aria-pressed="${planFilter==="all"}">All weeks</button>
      ${PHASES.map((p,i) => `<button class="chip" data-f="${i}" aria-pressed="${planFilter===String(i)}">${p[0]}</button>`).join("")}
      <span class="spacer"></span>
      <button class="btn" id="gonow" type="button">Go to this week</button>
      <button class="chip" id="hide" aria-pressed="${hideDone}">Hide done</button>
    </div><div id="weeks">`;
  let shown = 0;
  PHASES.forEach((p, i) => {
    if (planFilter !== "all" && planFilter !== String(i)) return;
    const ws = D.weeks.filter(w => w.n >= p[1] && w.n <= p[2]);
    const vis = ws.filter(w => !(hideDone && weekStats(w).done));
    if (!vis.length) return;
    html += `<div class="phase"><h2>${p[0]}</h2><div class="rule"></div><span class="cnt">Weeks ${p[1]}–${p[2]} · ${ws.filter(w => weekStats(w).done).length}/${ws.length} done</span></div>`;
    for (const w of vis) { html += weekCard(w, openWeek ? w.n === openWeek : w.n === (cw || 1)); shown++; }
  });
  if (!shown) html += `<p class="empty">Nothing left under this filter. Every week here is done.</p>`;
  html += `</div>${backupPanel()}</div>`;
  main.innerHTML = html;
  $$(".chip[data-f]").forEach(b => b.onclick = () => { planFilter = b.dataset.f; renderPlan(); });
  $("#hide").onclick = () => { hideDone = !hideDone; renderPlan(); };
  $("#gonow").onclick = () => { planFilter = "all"; hideDone = false; renderPlan(cw || 1); const el = $(`.day[data-w="${cw||1}"]`); if (el) el.scrollIntoView({behavior:"smooth", block:"center"}); };
  bindWeekCards(); bindBackup();

  };
  $("#quiz").onclick = e => { S.prefs.quiz = !S.prefs.quiz; e.currentTarget.setAttribute("aria-pressed", S.prefs.quiz); $("#rd").classList.toggle("quiz", S.prefs.quiz); changed("p"); };
  $$("[data-fs]").forEach(b => b.onclick = () => { S.prefs.size = Math.max(14, Math.min(20, (S.prefs.size||16) + (+b.dataset.fs))); applyPrefs(); changed("p", 1500); });
  const tb = $("#tocbtn"); if (tb) tb.onclick = () => openSheet(c);
  paintProgress();
  if (io) io.disconnect();

/* ---------------- search ---------------- */
let IDX = null, sel = 0;
async function openSearch(){
  $("#sdlg").hidden = false; const q = $("#sq"); q.value = ""; q.focus();
  $("#sres").innerHTML = `<p class="shint">Type at least 2 letters. ↑ ↓ to move, Enter to open, Esc to close.</p>`;
  if (!IDX) { try { IDX = await (await fetch("search.json")).json(); IDX.forEach(x => { x.lt = x.t.toLowerCase(); x.lx = x.x.toLowerCase(); }); } catch(e) { IDX = []; } }
}
function closeSearch(){ $("#sdlg").hidden = true; }
function runSearch(){
  const q = $("#sq").value.trim().toLowerCase(), out = $("#sres");
  if (q.length < 2 || !IDX) { out.innerHTML = `<p class="shint">Type at least 2 letters. ↑ ↓ to move, Enter to open, Esc to close.</p>`; return; }
  const terms = q.split(/\s+/).filter(Boolean);
  const hits = [];
  for (const x of IDX) {
    let score = 0, ok = true;
    for (const t of terms) { const inT = x.lt.includes(t), inX = x.lx.includes(t); if (!inT && !inX) { ok = false; break; } score += inT ? 10 : 1; }
    if (ok) { if (x.lt.includes(q)) score += 20; hits.push([score, x]); }
  }
  hits.sort((a,b) => b[0] - a[0]);
  sel = 0;
  if (!hits.length) { out.innerHTML = `<p class="shint">No section mentions “${esc(q)}”. Try a shorter word.</p>`; return; }
  const re = new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  out.innerHTML = hits.slice(0, 30).map(([, x], i) => {
    const pos = Math.max(0, x.lx.indexOf(terms[0]) - 60);
    const snip = (pos ? "…" : "") + x.x.slice(pos, pos + 180) + "…";
    const href = x.id.startsWith("s") ? "#" + x.id : "#c" + x.ch;
    return `<a href="${href}" aria-selected="${i===0}"><b>${esc(x.t).replace(re, "<mark>$1</mark>")}</b><small>Chapter ${x.ch} · ${esc(snip).replace(re, "<mark>$1</mark>")}</small></a>`;
  }).join("");
}
$("#sq").addEventListener("input", runSearch);
$("#sq").addEventListener("keydown", e => {
  const items = $$("#sres a");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!items.length) return; sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; items.forEach((a,i) => a.setAttribute("aria-selected", i === sel)); items[sel].scrollIntoView({block:"nearest"}); }
  else if (e.key === "Enter") { if (items[sel]) { location.hash = items[sel].getAttribute("href").slice(1); closeSearch(); } }
  else if (e.key === "Escape") closeSearch();
});
$("#sres").addEventListener("click", e => { if (e.target.closest("a")) closeSearch(); });
$("#sdlg").addEventListener("click", e => { if (e.target.id === "sdlg") closeSearch(); });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test((document.activeElement||{}).tagName || "");
  if (!typing && (e.key === "/" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"))) { e.preventDefault(); openSearch(); }
  if (e.key === "Escape" && !$("#sdlg").hidden) closeSearch();
});

/* ---------------- backup, downloads, toast ---------------- */
function backupPanel(){

    <p>${cloud.on ? "Your progress and notes are saved to your Claude account, privately, and sync to any device where you open this page signed in. A copy is also kept in this browser." : "Your progress and notes are saved in this browser. Copy a backup code to move them to another browser or device."}</p>
    <div class="io"><button class="btn" id="bk-copy" type="button">Copy backup code</button><button class="btn" id="bk-restore" type="button">Restore from code</button><button class="btn danger" id="bk-reset" type="button">Reset all progress</button></div>
    <textarea id="code" placeholder="The backup code appears here. To restore, paste a code and press Restore from code." spellcheck="false"></textarea>
    <div class="io"><button class="btn" data-dl="downloads/SDE2_Java_Study_Guide.pdf" type="button">Save the PDF (with bookmarks)</button><button class="btn" data-dl="downloads/SDE2_Study_Guide_Flashcards.csv" type="button">Save Anki flashcards (.csv)</button></div></div>`;
}
function bindBackup(){
  const cp = $("#bk-copy"); if (!cp) return;
  cp.onclick = async () => {
    const t = $("#code"); t.value = btoa(unescape(encodeURIComponent(JSON.stringify({read:S.read, rev:S.rev, tasks:S.tasks, notes:S.notes, last:S.last}))));
    t.select();
    try { await navigator.clipboard.writeText(t.value); toast("Backup code copied."); } catch(_) { toast("Select the code in the box and copy it."); }
  };
  $("#bk-restore").onclick = () => {
    const v = $("#code").value.trim();
    if (!v) { toast("Paste a backup code into the box first."); return; }
    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(v))));
      if (!o || typeof o !== "object" || !o.read) throw 0;
      S.read = o.read || {}; S.rev = o.rev || {}; S.tasks = o.tasks || {}; S.notes = o.notes || {}; S.last = o.last || null;
      changed("p"); changed("n"); refresh(); toast("Progress restored.");
    } catch(_) { toast("That code is not valid. Copy the whole code and try again."); }
  };
  $("#bk-reset").onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Press again to erase everything"; setTimeout(() => { b.dataset.armed = ""; b.textContent = "Reset all progress"; }, 4000); return; }
    S.read = {}; S.rev = {}; S.tasks = {}; S.notes = {}; S.last = null; changed("p"); changed("n"); refresh(); toast("All progress erased.");
  };
  $$("[data-dl]").forEach(b => b.onclick = async () => {
    b.disabled = true; const old = b.textContent; b.textContent = "Preparing…";
    try { const blob = await (await fetch(b.dataset.dl)).blob(); await saveFile(b.dataset.dl.split("/").pop(), blob); } finally { b.disabled = false; b.textContent = old; }
  });
}
async function saveFile(name, data){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (!dl) {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type:"text/plain"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); return;
  }
  try { const r = await dl.save({filename: name, data}); if (r && r.status === "saved") toast("Saved " + name); }
  catch(e) { if (!e || e.code !== "cancelled") toast("The file wasn’t saved."); }
}
let tt = null;
function toast(msg){
  let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600);
}

    S.prefs.theme = cur === "dark" ? "light" : "dark"; applyPrefs(); changed("p", 1500);
  }
  if (act === "backup") { e.preventDefault(); if (view !== "today") location.hash = "today"; setTimeout(() => { const b = $("#backup"); if (b) b.scrollIntoView({behavior:"smooth"}); }, 60); }
});
window.addEventListener("hashchange", route);

loadData().then(() => { route(); initCloud(); }).catch(() => { main.innerHTML = `<div class="page"><p class="empty">The guide’s data didn’t load. Reload the page to try again.</p></div>`; });
})();
